[package]
name = "ministry-scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = [
  "parking_lot",
  "rt-multi-thread",
  "net",
  "macros",
] }
tower-http = { version = "0.6.8", features = ["fs"] }
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
minijinja = { version = "2.14.0", features = ["loader"] }
maud = { version = "0.27.0", features = ["axum"] }
